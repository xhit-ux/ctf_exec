name: ctf-exec-local

services:
  mysql:
    image: mysql:8.0
    entrypoint: [sh, -ec, 'if [ "$$MYSQL_USER" = root ]; then unset MYSQL_USER MYSQL_PASSWORD; fi; exec docker-entrypoint.sh "$$@"', --]
    command: [mysqld]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ctf_exec}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?}}
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    volumes:
      - mysql:/var/lib/mysql
      - ../db/final.sql:/docker-entrypoint-initdb.d/01-ctf-exec.sql:ro
      - ./mysql-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
      - ../db/seed:/ctf-seed:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 --user="$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1 FROM users LIMIT 1"']
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: redis:7-alpine
    command: [sh, -ec, 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; fi; exec redis-server --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 24

  rabbitmq:
    image: rabbitmq:4.2-alpine
    hostname: ctf-exec-local-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 5s
      timeout: 5s
      retries: 24

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [minio]
    command: [server, /data, --address, ':9000']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
    ports:
      - '127.0.0.1:${LOCAL_MINIO_PORT:-9000}:9000'
    volumes:
      - minio:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 24

  registry:
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    ports:
      - 127.0.0.1:15000:5000
    volumes:
      - registry:/var/lib/registry
    networks:
      - cluster
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:5000/v2/']
      interval: 5s
      timeout: 3s
      retries: 24

networks:
  cluster:
    name: ctf-exec-local-cluster

volumes:
  mysql:
  redis:
  rabbitmq:
  registry:
  minio:
